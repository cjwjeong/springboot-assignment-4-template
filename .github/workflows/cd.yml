name: Spring seminar CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          # 👇 [수정 1, 2] YOUR_DOCKER_ID를 본인 아이디로 바꾸세요
          docker build -t jwjeong2187/k3s-demo-app:latest .
          docker push jwjeong2187/k3s-demo-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          script: |
            # 👇 [수정 3] YOUR_DOCKER_ID를 본인 아이디로 바꾸세요
            kubectl set image deployment/node-app node-app=jwjeong2187/k3s-demo-app:latest
            
            kubectl rollout restart deployment/node-app
